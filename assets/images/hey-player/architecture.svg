<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Hey Player voice control architecture</title>
  <desc id="desc">Microphone to Vosk wake detection to voxtype dictation to session injection to an OpenChamber agent; a parallel cached text-to-speech confirmation goes to the speakers; the agent drives Jellyfin MCP and local mpv playback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 10; }
      .label { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .sub { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #64748b; }
      .lane { font: 700 11px ui-sans-serif, system-ui, sans-serif; fill: #64748b; letter-spacing: .08em; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
      .note { font: 12px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#f6f8fb"/>

  <text class="lane" x="30" y="30">INPUT / WAKE</text>
  <rect class="box" x="30" y="45" width="110" height="62" rx="10"/>
  <text class="label" x="85" y="72" text-anchor="middle">Microphone</text>
  <text class="sub" x="85" y="90" text-anchor="middle">always listening</text>

  <rect class="box" x="180" y="45" width="150" height="62" rx="10" stroke="#2563eb"/>
  <text class="label" x="255" y="72" text-anchor="middle">Vosk spotter</text>
  <text class="sub" x="255" y="90" text-anchor="middle">"hey player" grammar</text>

  <rect class="box" x="370" y="45" width="130" height="62" rx="10" stroke="#2563eb"/>
  <text class="label" x="435" y="72" text-anchor="middle">voxtype</text>
  <text class="sub" x="435" y="90" text-anchor="middle">dictation to file</text>

  <rect class="box" x="540" y="45" width="140" height="62" rx="10" stroke="#2563eb"/>
  <text class="label" x="610" y="72" text-anchor="middle">hey-player-inject</text>
  <text class="sub" x="610" y="90" text-anchor="middle">session.send</text>

  <rect class="box" x="720" y="45" width="250" height="62" rx="10" stroke="#7c3aed"/>
  <text class="label" x="845" y="72" text-anchor="middle">OpenChamber voice session</text>
  <text class="sub" x="845" y="90" text-anchor="middle">agent executes only, no speech</text>

  <path class="edge" d="M 140 76 H 176"/>
  <path class="edge" d="M 330 76 H 366"/>
  <path class="edge" d="M 500 76 H 536"/>
  <path class="edge" d="M 680 76 H 716"/>

  <text class="lane" x="180" y="190">PARALLEL CONFIRMATION</text>
  <rect class="box" x="180" y="200" width="190" height="62" rx="10" stroke="#7c3aed"/>
  <text class="label" x="275" y="227" text-anchor="middle">hey-player-say</text>
  <text class="sub" x="275" y="245" text-anchor="middle">cached Kokoro TTS + 15 s guard</text>

  <rect class="box" x="420" y="200" width="130" height="62" rx="10" stroke="#7c3aed"/>
  <text class="label" x="485" y="227" text-anchor="middle">Speakers</text>
  <text class="sub" x="485" y="245" text-anchor="middle">pw-play</text>

  <path class="edge" d="M 255 107 V 196"/>
  <text class="note" x="263" y="160">transcript</text>
  <path class="edge" d="M 370 231 H 416"/>

  <text class="lane" x="30" y="350">LOCAL PLAYBACK</text>
  <rect class="box" x="30" y="365" width="170" height="62" rx="10" stroke="#059669"/>
  <text class="label" x="115" y="392" text-anchor="middle">Jellyfin MCP</text>
  <text class="sub" x="115" y="410" text-anchor="middle">patched auth header</text>

  <rect class="box" x="240" y="365" width="170" height="62" rx="10" stroke="#059669"/>
  <text class="label" x="325" y="392" text-anchor="middle">Jellyfin HTTP API</text>
  <text class="sub" x="325" y="410" text-anchor="middle">jellyfin.lan:8096</text>

  <rect class="box" x="450" y="365" width="170" height="62" rx="10" stroke="#059669"/>
  <text class="label" x="535" y="392" text-anchor="middle">Static stream URL</text>
  <text class="sub" x="535" y="410" text-anchor="middle">/Videos/{id}/stream?Static=true</text>

  <rect class="box" x="660" y="365" width="310" height="62" rx="10" stroke="#059669"/>
  <text class="label" x="815" y="392" text-anchor="middle">mpv on this machine</text>
  <text class="sub" x="815" y="410" text-anchor="middle">PipeWire audio, JSON IPC control</text>

  <path class="edge" d="M 200 396 H 236"/>
  <path class="edge" d="M 410 396 H 446"/>
  <path class="edge" d="M 620 396 H 656"/>

  <path class="edge" d="M 845 107 V 320 H 115 V 361"/>
  <text class="note" x="600" y="312">command from agent</text>

  <rect x="30" y="465" width="940" height="48" rx="10" fill="#e8eef7" stroke="#cbd5e1"/>
  <text class="note" x="48" y="486">GNOME IdleMonitor (idle after 10 min) → custom fullscreen Matrix screensaver. No lock, no suspend; the wake listener keeps running underneath.</text>
  <text class="note" x="48" y="504">Lid close and idle suspend are disabled in logind / GNOME power settings.</text>
</svg>
