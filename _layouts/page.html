---
layout: default
---

<div class="post-container">
    <div class="post-list">
        <span class="post-title">{{page.title}}</span>
        <a class="home" href="{{ site.url }}">home</a>
        <span class="blank">&nbsp;</span>
    </div>
</div>
<div class="blog-post-content">
    {% unless page.hide_title %}<h1>{{page.title}}</h1>{% endunless %}
    {{ content }}
</div>
